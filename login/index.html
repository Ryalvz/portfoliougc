<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Admin Ryan Alves</title>
<meta name="theme-color" content="#1F3FC3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #1F3FC3;
    --parchment: #F0EEEA;
    --olive: #8A855E;
    --muted: rgba(31, 63, 195, .8);
    --line: rgba(31, 63, 195, .2);
    --red: #b42318;
    --red-bg: #fdecea;
    --green: #1e6b45;
    --green-bg: #e3f2ea;
    --radius: 6px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--parchment); color: var(--cobalt);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5;
  }
  :focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  .card {
    width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line);
    border-top: 4px solid var(--cobalt); border-radius: var(--radius); padding: 28px 24px;
    box-shadow: 10px 10px 0 var(--olive);
  }
  .brand { font-weight: 700; letter-spacing: 2px; font-size: 12px; text-transform: uppercase; color: var(--olive); margin: 0 0 4px; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
  input {
    width: 100%; font: inherit; color: inherit; padding: 10px 12px; margin-bottom: 14px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--parchment);
  }
  input:focus { outline: none; border-color: var(--cobalt); box-shadow: 0 0 0 3px rgba(31, 63, 195, .15); }
  .btn {
    width: 100%; padding: 11px; border: 0; border-radius: var(--radius); cursor: pointer;
    background: var(--cobalt); color: var(--parchment); font: inherit; font-weight: 700;
  }
  .btn:disabled { opacity: .6; cursor: wait; }
  .link { background: none; border: 0; padding: 0; margin-top: 14px; color: var(--cobalt); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
  .faixa { border-radius: var(--radius); padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .faixa.erro { background: var(--red-bg); color: var(--red); border-left: 4px solid var(--red); }
  .faixa.ok { background: var(--green-bg); color: var(--green); border-left: 4px solid var(--green); }
  [hidden] { display: none !important; }
  .voltar { display: block; margin-top: 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <p class="brand">Ryan Alves · Admin</p>

  <!-- Tela de entrar -->
  <section id="tela-entrar">
    <h1>Entrar no painel</h1>
    <div class="faixa" id="aviso" role="alert" hidden></div>
    <form id="form-entrar" novalidate>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="btn-entrar">Entrar</button>
    </form>
    <button class="link" type="button" id="esqueci">Esqueci minha senha</button>
  </section>

  <!-- Tela de nova senha (abre pelo link do e-mail de recuperação) -->
  <section id="tela-nova" hidden>
    <h1>Criar nova senha</h1>
    <div class="faixa" id="aviso-nova" role="alert" hidden></div>
    <form id="form-nova" novalidate>
      <label for="nova">Nova senha (mínimo 8 caracteres)</label>
      <input id="nova" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn" type="submit">Salvar nova senha</button>
    </form>
  </section>

  <a class="voltar" href="../">Voltar para o portfólio</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const ADMIN = "../admin/";

function mostrar(el, texto, tipo) {
  el.textContent = texto;
  el.className = "faixa " + tipo;
  el.hidden = false;
}

// Traduz qualquer erro do Supabase para português
function traduzir(erro) {
  const m = ((erro && erro.message) || "").toLowerCase();
  if (m.includes("invalid login") || m.includes("invalid credentials")) return "E-mail ou senha incorretos";
  if (m.includes("email not confirmed")) return "Este e-mail ainda não foi confirmado no Supabase.";
  if (m.includes("rate limit") || m.includes("too many")) return "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.";
  if (m.includes("password") && m.includes("characters")) return "A senha precisa ter pelo menos 8 caracteres.";
  if (m.includes("same") && m.includes("password")) return "A nova senha precisa ser diferente da antiga.";
  if (m.includes("fetch") || m.includes("network")) return "Sem conexão com o servidor. Confira a internet e tente de novo.";
  return "Não deu certo agora. Tente de novo em instantes.";
}

if (!window.db) {
  mostrar($("#aviso"), "Não foi possível carregar o sistema de login. Confira a internet e recarregue a página.", "erro");
}

// Veio pelo link de recuperação de senha?
let recuperando = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);

function abrirNovaSenha() {
  recuperando = true;
  $("#tela-entrar").hidden = true;
  $("#tela-nova").hidden = false;
  $("#nova").focus();
}

if (window.db) {
  db.auth.onAuthStateChange((evento) => {
    if (evento === "PASSWORD_RECOVERY") abrirNovaSenha();
  });

  // Já tem sessão aberta? Vai direto para o admin.
  db.auth.getSession().then(({ data }) => {
    if (recuperando) { abrirNovaSenha(); return; }
    if (data && data.session) location.replace(ADMIN);
  });
}

$("#form-entrar").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!window.db) return;
  const email = $("#email").value.trim().toLowerCase();
  const senha = $("#senha").value;
  if (!email || !senha) { mostrar($("#aviso"), "Preencha o e-mail e a senha.", "erro"); return; }
  const btn = $("#btn-entrar");
  btn.disabled = true; btn.textContent = "Entrando...";
  const { data, error } = await db.auth.signInWithPassword({ email, password: senha });
  btn.disabled = false; btn.textContent = "Entrar";
  if (error) { mostrar($("#aviso"), traduzir(error), "erro"); return; }
  if ((data.user.email || "").toLowerCase() !== window.BANCO.emailAdmin) {
    await db.auth.signOut();
    mostrar($("#aviso"), "Este e-mail não tem acesso ao painel.", "erro");
    return;
  }
  location.replace(ADMIN);
});

$("#esqueci").addEventListener("click", async () => {
  if (!window.db) return;
  const email = $("#email").value.trim().toLowerCase();
  if (!email) { mostrar($("#aviso"), "Digite o seu e-mail no campo acima e clique de novo em Esqueci minha senha.", "erro"); $("#email").focus(); return; }
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) { mostrar($("#aviso"), traduzir(error), "erro"); return; }
  mostrar($("#aviso"), "Pronto. Se esse e-mail estiver cadastrado, chega um link para criar uma nova senha. Olhe também o spam.", "ok");
});

$("#form-nova").addEventListener("submit", async (e) => {
  e.preventDefault();
  const senha = $("#nova").value;
  if (senha.length < 8) { mostrar($("#aviso-nova"), "A senha precisa ter pelo menos 8 caracteres.", "erro"); return; }
  const { error } = await db.auth.updateUser({ password: senha });
  if (error) { mostrar($("#aviso-nova"), traduzir(error), "erro"); return; }
  mostrar($("#aviso-nova"), "Senha nova salva. Abrindo o painel...", "ok");
  setTimeout(() => location.replace(ADMIN), 1200);
});
</script>
</body>
</html>
