<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ryan Alves | Meus links</title>
<!-- Cursos que eu indico (links de afiliado). O conteúdo vem do painel: Link da bio -->
<meta name="description" content="Os cursos de UGC Creator e TikTok Shop que o Ryan indica.">
<meta property="og:title" content="Meus links | Ryan Alves">
<meta property="og:description" content="Os cursos de UGC Creator e TikTok Shop que eu indico.">
<meta property="og:image" content="https://ugc.ryalvz.com.br/bio/foto.jpg">
<meta name="theme-color" content="#F6F2EB">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --cafe: #2B241C;
    --creme: #F6F2EB;
    --dourado: #A8864A;
    --areia: #ECE5D9;
    --papel: #FCFAF6;
    --suave: #7A6E60;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--creme); color: var(--cafe); font-family: Montserrat, system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  main { max-width: 440px; margin: 0 auto; padding: 22px 18px calc(32px + env(safe-area-inset-bottom)); }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--dourado); outline-offset: 3px; }

  .voltar { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--areia); background: var(--papel); text-decoration: none; font-size: 13px; font-weight: 600; }
  .voltar svg { width: 16px; height: 16px; }

  .topo { text-align: center; margin-top: 18px; }
  .foto { display: block; width: 84px; height: 84px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 3px solid var(--papel); box-shadow: 0 0 0 1.5px var(--dourado), 0 10px 30px rgba(43, 36, 28, .14); }
  .foto img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15; margin: 14px 0 6px; }
  .frase { margin: 0 auto; max-width: 340px; color: var(--suave); font-size: 14px; }

  .titulo { margin: 30px 0 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--dourado); text-align: center; }
  .cursos { display: grid; gap: 12px; }
  .curso { background: var(--papel); border: 1px solid var(--areia); border-radius: 16px; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .curso:hover { border-color: var(--dourado); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43, 36, 28, .08); }
  .curso .ir { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-decoration: none; }
  .curso .logo { flex: none; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 12px; background: #fff; border: 1px solid var(--areia); overflow: hidden; font-size: 24px; }
  .curso .logo img { width: 100%; height: 100%; object-fit: contain; }
  .curso .txt { display: grid; min-width: 0; }
  .curso b { font-size: 15.5px; font-weight: 700; }
  .curso small { color: var(--suave); font-size: 13px; line-height: 1.35; }
  .curso .seta { margin-left: auto; flex: none; width: 18px; height: 18px; opacity: .55; }
  .cupom { display: flex; align-items: center; gap: 10px; margin: 0 16px 14px; padding: 8px 12px; border: 1px dashed var(--dourado); border-radius: 12px; font-size: 13px; }
  .cupom b { font-size: 14px; letter-spacing: 1px; }
  .cupom button { margin-left: auto; border: 1px solid var(--areia); background: var(--creme); color: var(--cafe); border-radius: 999px; padding: 6px 12px; min-height: 32px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }

  .vazio { text-align: center; color: var(--suave); margin: 32px 0; }
  .aviso { margin: 30px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--areia); color: var(--suave); font-size: 12.5px; text-align: center; }
  footer { margin-top: 30px; text-align: center; font-size: 12px; color: var(--suave); }
  footer em { font-family: "Playfair Display", Georgia, serif; font-style: italic; color: var(--dourado); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <a class="voltar" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Voltar</a>
  <header class="topo">
    <div class="foto"><img src="../foto.jpg" alt="Ryan Alves" width="639" height="800"></div>
    <h1>Meus links</h1>
    <p class="frase">Os cursos que eu indico pra quem quer começar no UGC e vender no TikTok Shop.</p>
  </header>

  <div id="lista"><p class="vazio">Carregando...</p></div>

  <p class="aviso">Alguns destes links são de afiliado: se você comprar por eles, eu ganho uma comissão, sem nenhum custo a mais pra você.</p>
  <footer><em>Ryan Alves</em><br>@ryalvz</footer>
</main>
<script src="../../js/banco.js?v=2"></script>
<script>
  const GRUPOS = [["ugc", "UGC Creator"], ["tiktok", "TikTok Shop"], ["outro", "Outros"]];
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const seguro = (u) => (/^https?:\/\//i.test(u || "") ? u : "");

  const contarClique = (link) => {
    try {
      fetch(`${BANCO.url}/rest/v1/bio_cliques`, { method: "POST", keepalive: true,
        headers: { apikey: BANCO.chave, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify({ pagina: "links", link: String(link).slice(0, 200) }) }).catch(() => {});
    } catch (_) {}
  };

  const cartao = (x) => `<article class="curso">
    <a class="ir" href="${esc(seguro(x.url))}" target="_blank" rel="noopener sponsored" data-clique="${esc(x.titulo)}">
      <span class="logo">${x.imagem ? `<img src="${esc(x.imagem)}" alt="" loading="lazy">` : "🎓"}</span>
      <span class="txt"><b>${esc(x.titulo)}</b>${x.texto ? `<small>${esc(x.texto)}</small>` : ""}</span>
      <svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </a>
    ${x.cupom ? `<div class="cupom">Cupom <b>${esc(x.cupom)}</b><button type="button" data-cupom="${esc(x.cupom)}">Copiar</button></div>` : ""}
  </article>`;

  bancoLer("site_conteudo", "select=valor&chave=eq.indicacoes").then((linhas) => {
    const itens = ((linhas[0] || {}).valor || []).filter((x) => x.ativo !== false && seguro(x.url));
    const el = document.getElementById("lista");
    if (!itens.length) { el.innerHTML = `<p class="vazio">Em breve, novidades por aqui.</p>`; return; }
    el.innerHTML = GRUPOS.map(([k, nome]) => {
      const g = itens.filter((x) => (GRUPOS.some(([c]) => c === x.categoria) ? x.categoria : "outro") === k);
      return g.length ? `<p class="titulo">${esc(nome)}</p><div class="cursos">${g.map(cartao).join("")}</div>` : "";
    }).join("");
  }).catch(() => { document.getElementById("lista").innerHTML = `<p class="vazio">Não deu pra carregar agora. Tenta de novo em instantes.</p>`; });

  document.addEventListener("click", async (e) => {
    const a = e.target.closest("[data-clique]");
    if (a) contarClique(a.dataset.clique);
    const c = e.target.closest("[data-cupom]");
    if (c) {
      try { await navigator.clipboard.writeText(c.dataset.cupom); c.textContent = "Copiado!"; } catch (_) { c.textContent = c.dataset.cupom; }
      setTimeout(() => { c.textContent = "Copiar"; }, 2000);
    }
  });
</script>
</body>
</html>
