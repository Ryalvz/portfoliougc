<style>
  :root {
    --cafe: #2B241C;      /* texto e botão principal */
    --creme: #F6F2EB;     /* fundo */
    --dourado: #A8864A;   /* detalhes */
    --areia: #ECE5D9;     /* bordas e seções suaves */
    --papel: #FCFAF6;     /* cards */
    --suave: #7A6E60;     /* texto secundário */
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--creme); color: var(--cafe); font-family: Montserrat, system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  main { max-width: 440px; margin: 0 auto; padding: 40px 18px calc(32px + env(safe-area-inset-bottom)); }
  a { color: inherit; }

  /* Topo */
  .topo { text-align: center; }
  /* Foto aproximada no rosto */
  .foto { display: block; width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 3px solid var(--papel); box-shadow: 0 0 0 1.5px var(--dourado), 0 10px 30px rgba(43, 36, 28, .14); }
  .foto img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15; margin: 16px 0 4px; }
  .papel { margin: 0; color: var(--suave); font-size: 14px; }
  .redes { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
  .redes a { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--papel); border: 1px solid var(--areia); transition: border-color .2s, transform .2s; }
  .redes a:hover { border-color: var(--dourado); transform: translateY(-2px); }
  .redes svg { width: 20px; height: 20px; }

  /* Botões */
  .titulo { margin: 32px 0 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--dourado); text-align: center; }
  .links { display: grid; gap: 12px; }
  .link { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--papel); border: 1px solid var(--areia); text-decoration: none; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .link:hover { border-color: var(--dourado); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43, 36, 28, .08); }
  .link:focus-visible, .redes a:focus-visible, .copiar:focus-visible { outline: 2px solid var(--dourado); outline-offset: 3px; }
  .link[hidden] { display: none; }
  .link .ic { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--creme); }
  .link .ic svg { width: 22px; height: 22px; }
  .link span { display: grid; min-width: 0; }
  .link b { font-size: 15px; font-weight: 600; }
  .link small { color: var(--suave); font-size: 12.5px; }
  .link .seta { margin-left: auto; flex: none; width: 18px; height: 18px; opacity: .55; }
  .link.principal { background: var(--cafe); border-color: var(--cafe); color: var(--creme); }
  .link.principal small { color: rgba(246, 242, 235, .7); }
  .link.principal .ic { background: rgba(246, 242, 235, .12); }
  .link.principal .seta { opacity: .8; }

  .email-linha { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--suave); }
  .copiar { border: 1px solid var(--areia); background: var(--papel); color: var(--cafe); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; min-height: 32px; }
  .copiar:hover { border-color: var(--dourado); }

  /* Marcas: a mesma faixa de logos do portfólio, correndo */
  .brands { margin: 0 -18px; border-top: 1px solid var(--areia); border-bottom: 1px solid var(--areia); overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .brands-track { display: flex; width: max-content; animation: marquee 150s linear infinite; }
  .brands-track ul { display: flex; align-items: center; list-style: none; margin: 0; padding: 22px 0; }
  .brands-track li { padding: 0 22px; }
  .brands-track img { display: block; height: calc(var(--h, 34px) * .78); width: auto; }
  .brands:hover .brands-track { animation-play-state: paused; }
  @keyframes marquee { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .brands-track { animation: none; width: 100%; } .brands-track ul[aria-hidden] { display: none; } .brands-track ul { flex-wrap: wrap; justify-content: center; row-gap: 14px; } }
  .mais { text-align: center; margin: 12px 0 0; font-size: 13px; color: var(--suave); }

  footer { margin-top: 36px; text-align: center; font-size: 12px; color: var(--suave); }
  footer em { font-family: "Playfair Display", Georgia, serif; font-style: italic; color: var(--dourado); font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
