<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Conectando o Gmail</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F0EEEA; color: #1a2a6c; font: 15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<!-- O Google volta para cá depois que o Ryan autoriza. Esta página só
     entrega o código para o painel (a janela que abriu esta) e fecha. -->
<p id="msg">Conectando o Gmail ao painel...</p>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var dados = { tipo: "gmail-code", code: p.get("code"), state: p.get("state"), erro: p.get("error") };
    if (window.opener) {
      window.opener.postMessage(dados, location.origin);
      setTimeout(function () { window.close(); }, 300);
    } else {
      document.getElementById("msg").textContent = "Pode fechar esta janela e voltar ao painel.";
    }
  })();
</script>
</body>
</html>
