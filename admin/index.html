<header class="topo-mobile">
  <button class="icone-btn" type="button" id="abrir-menu" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false"><svg class="i"><use href="#i-menu"/></svg></button>
  <strong id="titulo-mobile">Admin</strong>
</header>
<div class="fundo-menu" id="fundo-menu"></div>

<aside class="menu" id="menu" aria-label="Menu do painel">
  <div class="menu-marca">Ryan Alves <small>painel</small></div>
  <div class="menu-blocos">
    <button class="menu-item" type="button" data-aba="inicio"><svg class="i"><use href="#i-painel"/></svg>Dashboard</button>
    <div class="menu-bloco">
      <div class="menu-grupo">Clientes</div>
      <button class="menu-item" type="button" data-aba="propostas"><svg class="i"><use href="#i-email"/></svg>Propostas</button>
      <button class="menu-item" type="button" data-aba="marcas"><svg class="i"><use href="#i-marcas"/></svg>Marcas</button>
    </div>
    <div class="menu-bloco">
      <div class="menu-grupo">Negócios</div>
      <button class="menu-item" type="button" data-aba="campanhas"><svg class="i"><use href="#i-campanhas"/></svg>Campanhas</button>
      <button class="menu-item" type="button" data-aba="financeiro"><svg class="i"><use href="#i-financeiro"/></svg>Financeiro</button>
    </div>
    <div class="menu-bloco">
      <div class="menu-grupo">Conteúdo</div>
      <button class="menu-item" type="button" data-aba="calendario"><svg class="i"><use href="#i-calendario"/></svg>Calendário</button>
      <button class="menu-item" type="button" data-aba="transcricoes"><svg class="i"><use href="#i-transcricao"/></svg>Transcrições</button>
    </div>
    <div class="menu-bloco">
      <div class="menu-grupo">Redes sociais</div>
      <button class="menu-item" type="button" data-aba="instagram"><svg class="i"><use href="#i-insta"/></svg>Instagram</button>
    </div>
    <div class="menu-bloco">
      <div class="menu-grupo">Meu site</div>
      <button class="menu-item" type="button" data-aba="portfolio"><svg class="i"><use href="#i-portfolio"/></svg>Portfólio</button>
      <button class="menu-item" type="button" data-aba="checklist"><svg class="i"><use href="#i-checklist"/></svg>Checklist</button>
    </div>
  </div>
  <div class="menu-rodape">
    <button class="btn" type="button" id="abrir-notificacoes"><svg class="i"><use href="#i-sino"/></svg>Notificações no celular</button>
    <div id="email-logado"></div>
    <button class="btn" type="button" id="sair"><svg class="i"><use href="#i-sair"/></svg>Sair</button>
  </div>
</aside>

<main class="principal">
  <div class="cabeca">
    <div class="cabeca-titulo">
      <button class="icone-btn" type="button" id="alternar-menu" aria-label="Mostrar ou esconder o menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <h1 id="titulo">Dashboard</h1>
    </div>
    <div class="cabeca-acoes">
      <button class="icone-btn cabeca-icone" type="button" id="modo-privado" aria-pressed="false" aria-label="Esconder valores" title="Esconder valores"><svg class="i"><use href="#i-olho"/></svg></button>
      <!-- Lembretes do dia (TikTok Shop, pagamentos, notas, entregas, negociações) -->
      <div class="sino-caixa">
        <button class="icone-btn cabeca-icone" type="button" id="abrir-lembretes" aria-expanded="false" aria-controls="lembretes" aria-label="Lembretes"><svg class="i"><use href="#i-sino"/></svg><i id="sino-conta" hidden></i></button>
        <div class="painel-lembretes" id="lembretes" hidden></div>
      </div>
      <a class="btn" href="../" target="_blank" rel="noopener"><svg class="i"><use href="#i-link"/></svg><span class="some-celular">Ver meu site</span></a>
    </div>
  </div>

  <!-- Aviso quando falta alguma tabela ou campo no banco -->
  <div id="avisos"></div>


  <section id="aba-inicio" data-titulo="Dashboard"></section>
  <section id="aba-portfolio" data-titulo="Portfólio" hidden></section>
  <section id="aba-propostas" data-titulo="Propostas" hidden></section>
  <section id="aba-instagram" data-titulo="Instagram" hidden></section>
  <section id="aba-marcas" data-titulo="Marcas" hidden></section>
  <section id="aba-calendario" data-titulo="Calendário" hidden></section>
  <section id="aba-campanhas" data-titulo="Campanhas" hidden></section>
  <section id="aba-financeiro" data-titulo="Financeiro" hidden></section>
  <section id="aba-transcricoes" data-titulo="Transcrições" hidden></section>
  <section id="aba-checklist" data-titulo="Checklist do portfólio" hidden></section>
</main>

<dialog id="janela"></dialog>
