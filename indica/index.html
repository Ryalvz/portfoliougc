<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ryan Alves | Indicações</title>
<!-- Produtos que eu indico, com o link de cada loja. Não aparece na bio: eu mando o link no direct ou na automação -->
<meta name="description" content="Os produtos que eu uso e indico, com o link da Shopee, do Mercado Livre e da Amazon pra você comparar o preço.">
<meta property="og:title" content="Indicações | Ryan Alves">
<meta property="og:description" content="Compare o preço nas lojas e escolha a sua.">
<meta property="og:image" content="https://ugc.ryalvz.com.br/bio/foto.jpg">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F2EB">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --cafe: #2B241C;
    --creme: #F6F2EB;
    --dourado: #A8864A;
    --areia: #ECE5D9;
    --papel: #FCFAF6;
    --suave: #7A6E60;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--creme); color: var(--cafe); font-family: Montserrat, system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  main { max-width: 460px; margin: 0 auto; padding: 22px 16px calc(32px + env(safe-area-inset-bottom)); }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--dourado); outline-offset: 3px; }

  .voltar { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--areia); background: var(--papel); text-decoration: none; font-size: 13px; font-weight: 600; }
  .voltar svg { width: 16px; height: 16px; }

  .topo { text-align: center; margin-top: 18px; }
  .foto { display: block; width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 3px solid var(--papel); box-shadow: 0 0 0 1.5px var(--dourado), 0 10px 30px rgba(43, 36, 28, .14); }
  .foto img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  .selo { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--dourado); }
  h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15; margin: 12px 0 6px; }
  .frase { margin: 0 auto; max-width: 360px; color: var(--suave); font-size: 14px; }

  /* Grupos (subgrupos) */
  .grupos { display: flex; gap: 8px; overflow-x: auto; margin: 22px -16px 0; padding: 2px 16px 6px; scrollbar-width: none; }
  .grupos::-webkit-scrollbar { display: none; }
  .grupos button { flex: none; min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--areia); background: var(--papel); color: var(--cafe); font: 600 13px Montserrat, system-ui, sans-serif; cursor: pointer; }
  .grupos button[aria-pressed="true"] { background: var(--cafe); border-color: var(--cafe); color: var(--creme); }
  .titulo { margin: 26px 0 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--dourado); text-align: center; }

  /* Lista de produtos */
  .lista { display: grid; gap: 12px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: var(--papel); border: 1px solid var(--areia); border-radius: 16px; text-decoration: none; transition: border-color .2s, transform .2s; }
  .item:hover { border-color: var(--dourado); transform: translateY(-2px); }
  .mini { flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 12px; background: #fff; border: 1px solid var(--areia); overflow: hidden; font-family: "Playfair Display", Georgia, serif; font-size: 24px; color: var(--dourado); }
  .mini { position: relative; }
  .mini img, .produto .capa img { position: absolute; max-width: none; display: block; }
  .item .txt { display: grid; min-width: 0; }
  .item b { font-size: 15px; }
  .item small { color: var(--suave); font-size: 12.5px; }
  .item .seta { margin-left: auto; flex: none; width: 18px; height: 18px; opacity: .55; }

  /* Um produto aberto */
  .produto { margin-top: 22px; background: var(--papel); border: 1px solid var(--areia); border-radius: 20px; overflow: hidden; }
  .produto .corpo { padding: 18px 18px 20px; }
  /* Foto pequena ao lado do nome */
  .produto .cab { display: flex; align-items: center; gap: 14px; }
  .produto .capa { position: relative; flex: none; display: grid; place-items: center; width: 92px; height: 92px; border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid var(--areia); }
  .produto .capa span { font-family: "Playfair Display", Georgia, serif; font-size: 36px; color: var(--dourado); }
  .produto .cab > div { min-width: 0; }
  .produto h2 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 23px; line-height: 1.2; margin: 4px 0 0; }
  .opiniao { margin: 12px 0 0; font-size: 14.5px; }
  .opiniao::before { content: "O que eu achei"; display: block; margin-bottom: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dourado); }
  .comparar { margin: 20px 0 10px; font-size: 13px; font-weight: 600; color: var(--suave); text-align: center; }
  .lojas { display: grid; gap: 10px; }
  .loja { display: grid; gap: 8px; }
  .loja a { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 14px; background: var(--cafe); color: var(--creme); text-decoration: none; font-weight: 600; font-size: 15px; }
  .loja a:hover { background: #3A3128; }
  .loja .marca { flex: none; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(246, 242, 235, .35); }
  .loja .marca.shopee { background: #EE4D2D; }
  .loja .marca.mercadolivre { background: #FFE600; }
  .loja .marca.amazon { background: #FF9900; }
  .loja .marca.outra { background: #D9C48A; }
  .loja .ver { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: rgba(246, 242, 235, .75); }
  .loja a svg { width: 18px; height: 18px; }
  .cupom { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px dashed var(--dourado); border-radius: 12px; font-size: 13px; }
  .cupom b { font-size: 14px; letter-spacing: 1px; }
  .cupom button { margin-left: auto; border: 1px solid var(--areia); background: var(--creme); color: var(--cafe); border-radius: 999px; padding: 6px 12px; min-height: 32px; font: 600 12px Montserrat, system-ui, sans-serif; cursor: pointer; }
  .aviso { margin: 16px 0 0; font-size: 12px; color: var(--suave); text-align: center; }

  .vazio { text-align: center; color: var(--suave); margin: 32px 0; }
  footer { margin-top: 30px; text-align: center; font-size: 12px; color: var(--suave); }
  footer em { font-family: "Playfair Display", Georgia, serif; font-style: italic; color: var(--dourado); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <a class="voltar" id="voltar" href="./" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Ver todas as indicações</a>
  <header class="topo" id="topo">
    <div class="foto"><img src="../bio/foto.jpg" alt="Ryan Alves" width="639" height="800"></div>
    <span class="selo">Indicações do Ryan</span>
    <h1>O que eu uso e indico</h1>
    <p class="frase">Cada produto tem o link de mais de uma loja. Abre todas, compara o preço e fica com a melhor.</p>
  </header>

  <div id="conteudo"><p class="vazio">Carregando...</p></div>

  <footer><em>Ryan Alves</em><br>@ryalvz</footer>
</main>
<script src="../js/banco.js?v=2"></script>
<script>
  const LOJAS = { shopee: "Shopee", mercadolivre: "Mercado Livre", amazon: "Amazon" };
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const seguro = (u) => (/^https?:\/\//i.test(u || "") ? u : "");
  const SETA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
  const el = document.getElementById("conteudo");
  const slugPedido = new URLSearchParams(location.search).get("p") || "";

  const contarClique = (link) => {
    try {
      fetch(`${BANCO.url}/rest/v1/bio_cliques`, { method: "POST", keepalive: true,
        headers: { apikey: BANCO.chave, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify({ pagina: "indica", link: String(link).slice(0, 200) }) }).catch(() => {});
    } catch (_) {}
  };

  // Enquadramento escolhido no painel. quadro = { s: zoom (1 = foto inteira), cx, cy: ponto da foto no centro (0 a 1), r: largura/altura }
  // Sem quadro, a foto preenche o quadrado, centralizada.
  const quadro = (x) => {
    const q = x.quadro;
    if (!q || !q.r) return ` style="width:100%;height:100%;object-fit:cover;position:static"`;
    const w = q.s * Math.min(1, q.r) * 100, h = q.s * Math.min(1, 1 / q.r) * 100;
    return ` style="width:${w}%;height:${h}%;left:${50 - q.cx * w}%;top:${50 - q.cy * h}%"`;
  };
  const inicial = (x) => esc((x.titulo || "?").trim().charAt(0).toUpperCase());
  const lojasDe = (x) => (x.lojas || []).filter((l) => seguro(l.url));
  const nomeLoja = (l) => LOJAS[l.loja] || l.nome || "Outra loja";

  const itemLista = (x) => `<a class="item" href="?p=${encodeURIComponent(x.slug)}">
    <span class="mini">${x.imagem ? `<img src="${esc(x.imagem)}" alt="" loading="lazy"${quadro(x)}>` : inicial(x)}</span>
    <span class="txt"><b>${esc(x.titulo)}</b><small>${lojasDe(x).map(nomeLoja).map(esc).join(" · ")}</small></span>
    ${SETA.replace("<svg", '<svg class="seta"')}
  </a>`;

  function mostrarProduto(x, todos) {
    document.getElementById("topo").hidden = true;
    document.getElementById("voltar").hidden = false;
    document.title = `${x.titulo} | Indicações do Ryan`;
    const lojas = lojasDe(x);
    const outros = todos.filter((o) => o.slug !== x.slug && o.grupo === x.grupo);
    el.innerHTML = `<article class="produto">
      <div class="corpo">
        <div class="cab">
          <div class="capa">${x.imagem ? `<img src="${esc(x.imagem)}" alt="${esc(x.titulo)}"${quadro(x)}>` : `<span>${inicial(x)}</span>`}</div>
          <div>${x.grupo ? `<span class="selo">${esc(x.grupo)}</span>` : ""}<h2>${esc(x.titulo)}</h2></div>
        </div>
        ${x.texto ? `<p class="opiniao">${esc(x.texto)}</p>` : ""}
        <p class="comparar">${lojas.length > 1 ? "Compare o preço e escolha a sua loja" : "Onde comprar"}</p>
        <div class="lojas">${lojas.map((l) => `<div class="loja">
          <a href="${esc(l.url)}" target="_blank" rel="noopener sponsored" data-clique="${esc(x.slug + ":" + l.loja)}"><span class="marca ${esc(LOJAS[l.loja] ? l.loja : "outra")}"></span>${esc(nomeLoja(l))}<span class="ver">Ver preço${SETA}</span></a>
          ${l.cupom ? `<div class="cupom">Cupom ${esc(nomeLoja(l))} <b>${esc(l.cupom)}</b><button type="button" data-cupom="${esc(l.cupom)}">Copiar</button></div>` : ""}
        </div>`).join("")}</div>
        <p class="aviso">O preço muda toda hora, por isso vale abrir as lojas.</p>
      </div>
    </article>
    ${outros.length ? `<p class="titulo">Mais em ${esc(x.grupo)}</p><div class="lista">${outros.map(itemLista).join("")}</div>` : ""}`;
  }

  function mostrarLista(todos) {
    const grupos = [...new Set(todos.map((x) => x.grupo || "Outros"))];
    const pintar = (g) => {
      const vis = g ? todos.filter((x) => (x.grupo || "Outros") === g) : todos;
      const blocos = (g ? [g] : grupos).map((nome) => {
        const itens = vis.filter((x) => (x.grupo || "Outros") === nome);
        return itens.length ? `<p class="titulo">${esc(nome)}</p><div class="lista">${itens.map(itemLista).join("")}</div>` : "";
      }).join("");
      el.innerHTML = (grupos.length > 1 ? `<div class="grupos">${["", ...grupos].map((n) => `<button type="button" data-grupo="${esc(n)}" aria-pressed="${n === (g || "")}">${esc(n || "Todos")}</button>`).join("")}</div>` : "") + blocos;
    };
    pintar("");
    el.addEventListener("click", (e) => { const b = e.target.closest("[data-grupo]"); if (b) pintar(b.dataset.grupo); });
  }

  bancoLer("site_conteudo", "select=valor&chave=eq.produtos").then((linhas) => {
    const todos = ((linhas[0] || {}).valor || []).filter((x) => x.ativo !== false && x.slug && lojasDe(x).length);
    if (slugPedido) {
      const x = todos.find((p) => p.slug === slugPedido);
      if (x) return mostrarProduto(x, todos);
    }
    if (!todos.length) { el.innerHTML = `<p class="vazio">Em breve, indicações por aqui.</p>`; return; }
    mostrarLista(todos);
  }).catch(() => { el.innerHTML = `<p class="vazio">Não deu pra carregar agora. Tenta de novo em instantes.</p>`; });

  document.addEventListener("click", async (e) => {
    const a = e.target.closest("[data-clique]");
    if (a) contarClique(a.dataset.clique);
    const c = e.target.closest("[data-cupom]");
    if (c) {
      try { await navigator.clipboard.writeText(c.dataset.cupom); c.textContent = "Copiado"; } catch (_) { c.textContent = c.dataset.cupom; }
      setTimeout(() => { c.textContent = "Copiar"; }, 2000);
    }
  });
</script>
</body>
</html>
